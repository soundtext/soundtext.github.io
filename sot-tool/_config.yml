# sot-tool — minimal Jekyll site hosting only the Korean Text-to-Speech tool
# and its documentation. All static pages, navigation menus, footers, ads,
# and tracking scripts have been intentionally removed.

title: "Sound of Text — Korean TTS"
description: "Free Korean text-to-speech converter. Paste Hangul or Korean text, generate natural MP3 audio, and download instantly — powered by the Sound of Text API."
author: "Sound of Text Team"

url: ""
baseurl: ""

# SEO Defaults
markdown: kramdown
permalink: /:title/

# Sass
sass:
  style: :compressed

# Exclude build artifacts
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache

# Plugins
plugins:
  - jekyll-seo-tag